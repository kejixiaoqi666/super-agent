name: test

# 持续集成：push / PR 自动跑全量测试门禁。
# 主 job：三平台纯 Python 测试（快速、确定），保证日常回归绿。
# 集成 job：Linux 编译 superbrain-2.0 真实内核，跑需真实内核的 test_body。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: python-${{ matrix.py }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pytest
      - name: Lint (pyflakes)
        run: python -m pyflakes agent_body/ memory_plane/ tests/
      - name: Run tests (pure-Python; real-kernel tests run in integration job)
        # test_body / test_runtime_wiring 依赖真实内核(superbrain2)，需编译，放集成 job；
        # 主 job 排除它们保持快速确定
        run: python -m pytest tests/ -q --ignore=tests/test_body.py --ignore=tests/test_runtime_wiring.py

  integration-kernel:
    name: kernel-integration (real superbrain-2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Clone real kernel
        run: git clone --depth 1 https://github.com/kejixiaoqi666/superbrain-2.0.git ../superbrain-2.0
      - name: Build & install kernel (maturin)
        working-directory: ../superbrain-2.0
        run: |
          pip install --upgrade pip maturin
          pip install .
      - name: Install body deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run real-kernel tests
        run: python -m pytest tests/test_body.py tests/test_runtime_wiring.py -q
